<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Echo</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="notice" id="notice" hidden role="status" aria-live="polite">
    <p class="notice-title" id="notice-title"></p>
    <p class="notice-body" id="notice-body"></p>
    <p class="notice-code" id="notice-code" hidden><code id="notice-line"></code> <button id="notice-copy" type="button">Copy</button></p>
    <p class="notice-actions"><button id="notice-tab" type="button">Open in a tab instead</button> <button class="secondary" id="notice-options" type="button">Settings</button></p>
  </div>
  <iframe id="echo" title="Echo" allow="clipboard-write" referrerpolicy="strict-origin"></iframe>
  <script src="echo-link.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
