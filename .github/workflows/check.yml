name: Check Echo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:graph
      - run: npm run check:portable
      - run: npm run check:readiness
      - run: npm run check:evaluation
      - run: npm run check:wording
      - run: npm run check:pipeline
      - run: npm run check:copy-hunt
      - run: npm run check:claims
      - run: npm run check:copy
      - run: npm run check:links
      - run: npm run build
